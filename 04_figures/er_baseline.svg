<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="780" viewBox="0 0 1300 780"><rect width="1300" height="780" fill="white"/><style>text{font-family:"Times New Roman",serif;fill:#17283d} .head{font-size:24px;font-weight:bold} .sub{font-size:18px;fill:#566374} .entity{fill:#f7f9fc;stroke:#2a4a79;stroke-width:2} .name{font-size:21px;font-weight:bold} .attr{font-size:19px} .card{font-size:20px;fill:#a12828} .line{stroke:#354052;stroke-width:2} .foot{font-size:15px;fill:#536273}</style><text x="650" y="65" text-anchor="middle" class="head">Ride-Hailing Order and Trip Dispatch</text><text x="650" y="91" text-anchor="middle" class="sub">B2 official five-entity ER baseline</text><line x1="300" y1="350" x2="440" y2="343" class="line"/><line x1="880" y1="363" x2="705" y2="343" class="line"/><line x1="1037" y1="235" x2="1037" y2="290" class="line"/><line x1="572" y1="458" x2="572" y2="540" class="line"/><rect x="75" y="288" width="225" height="125" class="entity"/><text x="93" y="319" class="name">Passenger</text><text x="93" y="348" class="attr" font-style="italic">psg_id  (PK)</text><text x="93" y="373" class="attr" >name</text><rect x="440" y="228" width="265" height="230" class="entity"/><text x="458" y="259" class="name">Trip</text><text x="458" y="288" class="attr" font-style="italic">trip_id  (PK)</text><text x="458" y="313" class="attr" >*psg_id  (FK)</text><text x="458" y="338" class="attr" >*driver_id  (FK)</text><text x="458" y="363" class="attr" >fare</text><text x="458" y="388" class="attr" >status</text><text x="458" y="413" class="attr" >start_time</text><rect x="880" y="290" width="315" height="145" class="entity"/><text x="898" y="321" class="name">Driver</text><text x="898" y="350" class="attr" font-style="italic">driver_id  (PK)</text><text x="898" y="375" class="attr" >name</text><text x="898" y="400" class="attr" >*vehicle_id  (FK, UNIQUE)</text><rect x="895" y="115" width="285" height="120" class="entity"/><text x="913" y="146" class="name">Vehicle</text><text x="913" y="175" class="attr" font-style="italic">vehicle_id  (PK)</text><text x="913" y="200" class="attr" >plate  (UNIQUE)</text><rect x="450" y="540" width="250" height="160" class="entity"/><text x="468" y="571" class="name">Payment</text><text x="468" y="600" class="attr" font-style="italic">pay_id  (PK)</text><text x="468" y="625" class="attr" >*trip_id  (FK, UNIQUE)</text><text x="468" y="650" class="attr" >amount</text><text x="468" y="675" class="attr" >method</text><text x="375" y="333" text-anchor="middle" class="card">1 : N</text><text x="780" y="333" text-anchor="middle" class="card">N : 1</text><text x="1037" y="265" text-anchor="middle" class="card">1 : N</text><text x="650" y="505" text-anchor="middle" class="card">1 : 1</text><text x="650" y="746" text-anchor="middle" class="foot">Italic = primary key; * = foreign key. Teacher Figure 5 cardinalities; SQL differences are recorded separately.</text></svg>