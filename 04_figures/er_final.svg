<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1060" viewBox="0 0 1750 1060">
<rect width="1750" height="1060" fill="white"/>
<style>text{font-family:Times New Roman,serif;fill:#203049}.head{font-weight:bold;font-size:23px}.body{font-size:18px}.small{font-size:15px;fill:#45566B}.card{font-size:17px;fill:#9B2626}</style>
<text x="875" y="50" text-anchor="middle" class="head">Ride-Hailing ER v1.0</text>
<text x="875" y="80" text-anchor="middle" class="small">Official five-table base + D-11 extension layer · 3 November 2026</text>
<line x1="340" y1="337" x2="470" y2="337" stroke="#40516B" stroke-width="2"/>
<line x1="960" y1="357" x2="790" y2="357" stroke="#40516B" stroke-width="2"/>
<line x1="1525" y1="210" x2="1122" y2="275" stroke="#40516B" stroke-width="2"/>
<line x1="630" y1="480" x2="640" y2="695" stroke="#40516B" stroke-width="2"/>
<line x1="790" y1="460" x2="960" y2="665" stroke="#40516B" stroke-width="2"/>
<line x1="1390" y1="555" x2="1310" y2="710" stroke="#40516B" stroke-width="2"/>
<line x1="1390" y1="857" x2="1310" y2="780" stroke="#40516B" stroke-width="2"/>
<rect x="60" y="265" width="280" height="145" fill="#F4F7FC" stroke="#365B8C" stroke-width="2"/>
<text x="77" y="295" class="head">Passenger</text>
<text x="77" y="323" class="body"><tspan font-style="italic">psg_id</tspan> (PK)</text>
<text x="77" y="350" class="body">name</text>
<rect x="470" y="225" width="320" height="255" fill="#F4F7FC" stroke="#365B8C" stroke-width="2"/>
<text x="487" y="255" class="head">Trip</text>
<text x="487" y="283" class="body"><tspan font-style="italic">trip_id</tspan> (PK)</text>
<text x="487" y="310" class="body">*psg_id (FK)</text>
<text x="487" y="337" class="body">*driver_id (FK)</text>
<text x="487" y="364" class="body">fare</text>
<text x="487" y="391" class="body">status</text>
<text x="487" y="418" class="body">start_time</text>
<rect x="960" y="275" width="325" height="165" fill="#F4F7FC" stroke="#365B8C" stroke-width="2"/>
<text x="977" y="305" class="head">Driver</text>
<text x="977" y="333" class="body"><tspan font-style="italic">driver_id</tspan> (PK)</text>
<text x="977" y="360" class="body">name</text>
<text x="977" y="387" class="body">*vehicle_id (FK, UNIQUE)</text>
<rect x="1380" y="70" width="290" height="140" fill="#F4F7FC" stroke="#365B8C" stroke-width="2"/>
<text x="1397" y="100" class="head">Vehicle</text>
<text x="1397" y="128" class="body"><tspan font-style="italic">vehicle_id</tspan> (PK)</text>
<text x="1397" y="155" class="body">plate (UNIQUE)</text>
<rect x="480" y="695" width="320" height="170" fill="#F4F7FC" stroke="#365B8C" stroke-width="2"/>
<text x="497" y="725" class="head">Payment</text>
<text x="497" y="753" class="body"><tspan font-style="italic">pay_id</tspan> (PK)</text>
<text x="497" y="780" class="body">*trip_id (FK, UNIQUE)</text>
<text x="497" y="807" class="body">amount</text>
<text x="497" y="834" class="body">method</text>
<rect x="960" y="630" width="350" height="225" fill="#EAF4F1" stroke="#23816F" stroke-width="2"/>
<text x="977" y="660" class="head">trip_detail</text>
<text x="977" y="688" class="body"><tspan font-style="italic">*trip_id</tspan> (PK, FK)</text>
<text x="977" y="715" class="body">*service_tier_id (FK)</text>
<text x="977" y="742" class="body">*zone_id (FK)</text>
<text x="977" y="769" class="body">rating (1–5, nullable)</text>
<rect x="1390" y="465" width="300" height="180" fill="#EAF4F1" stroke="#23816F" stroke-width="2"/>
<text x="1407" y="495" class="head">service_tier</text>
<text x="1407" y="523" class="body"><tspan font-style="italic">tier_id</tspan> (PK)</text>
<text x="1407" y="550" class="body">name (UNIQUE)</text>
<text x="1407" y="577" class="body">fare_multiplier</text>
<rect x="1390" y="780" width="300" height="155" fill="#EAF4F1" stroke="#23816F" stroke-width="2"/>
<text x="1407" y="810" class="head">pickup_zone</text>
<text x="1407" y="838" class="body"><tspan font-style="italic">zone_id</tspan> (PK)</text>
<text x="1407" y="865" class="body">name (UNIQUE)</text>
<rect x="340" y="325" width="125" height="34" fill="white"/>
<text x="402" y="348" text-anchor="middle" class="card">1 : N</text>
<rect x="805" y="335" width="125" height="34" fill="white"/>
<text x="867" y="358" text-anchor="middle" class="card">N : 1</text>
<rect x="1260" y="215" width="125" height="34" fill="white"/>
<text x="1322" y="238" text-anchor="middle" class="card">1 : 1*</text>
<rect x="635" y="540" width="125" height="34" fill="white"/>
<text x="697" y="563" text-anchor="middle" class="card">1 : 1*</text>
<rect x="835" y="535" width="125" height="34" fill="white"/>
<text x="897" y="558" text-anchor="middle" class="card">1 : 1*</text>
<rect x="1315" y="625" width="125" height="34" fill="white"/>
<text x="1377" y="648" text-anchor="middle" class="card">1 : N</text>
<rect x="1320" y="820" width="125" height="34" fill="white"/>
<text x="1382" y="843" text-anchor="middle" class="card">1 : N</text>
<text x="875" y="985" text-anchor="middle" class="small">Italic = primary key; * = foreign key. 1:1* means SQL allows 0..1 on the parent side. Driver.vehicle_id UNIQUE limits Vehicle to 0..1 Driver.</text>
<text x="875" y="1020" text-anchor="middle" class="small">Trip starts at driver acceptance (D-05). Generated data gives each Trip one trip_detail; the PK/FK itself ensures only at most one.</text>
</svg>